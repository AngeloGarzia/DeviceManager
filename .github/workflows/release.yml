name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Create GitHub Release + artefacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Extract version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build release notes from CHANGELOG
        id: notes
        run: |
          python3 <<'PY'
          import pathlib
          import re
          import os

          version = os.environ["VERSION"]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          # Match ## [x.y.z] ... until next ## [
          pattern = rf"^## \[{re.escape(version)}\].*?(?=^## \[|\Z)"
          match = re.search(pattern, text, flags=re.M | re.S)
          body = match.group(0).strip() if match else f"Release v{version}\n\nSee CHANGELOG.md."
          pathlib.Path("release-notes.md").write_text(body + "\n", encoding="utf-8")
          PY
        env:
          VERSION: ${{ steps.ver.outputs.version }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build backend JAR
        working-directory: backend
        run: mvn -B -DskipTests package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.ver.outputs.version }}
          body_path: release-notes.md
          generate_release_notes: true
          files: backend/target/device-manager-*.jar

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image versionnée pour rollback manuel — le déploiement Render (ci-cd.yml) est inchangé.
      - name: Build and push backend image
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          VERSION="${{ steps.ver.outputs.version }}"
          docker build -t "${IMAGE}:${VERSION}" -t "${IMAGE}:latest" ./backend
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:latest"
          echo "Pushed ${IMAGE}:${VERSION} and ${IMAGE}:latest"
