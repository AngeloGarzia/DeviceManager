name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Tests + JaCoCo
        run: mvn -B test

      - name: Checkstyle
        run: mvn -B -DskipTests checkstyle:check

      - name: SpotBugs
        run: mvn -B -DskipTests spotbugs:check

      # OWASP Dependency-Check : miroir NVD (pas l'API REST) — pas besoin de NVD_API_KEY.
      # Cache mensuel ; préfixe v3 = ODC 13 + schéma URL 4000 (fix CVE Mozilla trop longues).
      - name: Dependency-Check cache month
        id: dc-date
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cache OWASP Dependency-Check DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/dependency-check
          key: dependency-check-v3-${{ runner.os }}-${{ steps.dc-date.outputs.month }}
          restore-keys: |
            dependency-check-v3-${{ runner.os }}-

      - name: OWASP Dependency-Check
        run: mvn -B -DskipTests dependency-check:check

      - name: JaCoCo coverage gate
        run: mvn -B -DskipTests jacoco:check

      - name: Package
        run: mvn -B -DskipTests package

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: ignore

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # Seuil bloquant: critical (les high Angular 19 n'ont pas encore de patch mineur).
      - name: npm audit prod (critical)
        run: npm audit --omit=dev --audit-level=critical

      - name: npm audit prod high (report)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: npm audit all (report)
        continue-on-error: true
        run: npm audit --audit-level=high || true

      - name: Unit tests
        run: npm run test:ci

      - name: Production build
        env:
          # URL de l’API prod (override : Settings → Variables → Actions → API_URL)
          API_URL: ${{ vars.API_URL != '' && vars.API_URL || 'https://devicemanager.cleverapps.io' }}
        run: |
          node scripts/inject-api-url.mjs
          npm run build -- --configuration=production

  trivy-backend-image:
    name: Trivy (backend image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build backend image
        run: docker build -t device-manager-backend:ci ./backend

      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: device-manager-backend:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  # Le déploiement prod est fait par Clever Cloud (lien GitHub → auto-deploy sur push main).
  # Pas de job deploy ici → évite un double déploiement.

  smoke-prod:
    name: Smoke (production health)
    needs: [backend, frontend, trivy-backend-image]
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Curl actuator health
        env:
          API_URL: ${{ vars.API_URL != '' && vars.API_URL || 'https://devicemanager.cleverapps.io' }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "vars.API_URL missing — skip smoke-prod gracefully"
            exit 0
          fi
          # Clever rebuild en parallèle du CI : retries larges
          curl -fsS --retry 18 --retry-delay 20 --retry-all-errors "${API_URL%/}/actuator/health"
          echo
          echo "Health check OK"
