name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # OWASP Dependency-Check (lourd) : rappel hebdo même sans push.
  schedule:
    - cron: "0 4 * * 1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Tests + JaCoCo
        run: mvn -B test

      - name: Checkstyle
        run: mvn -B -DskipTests checkstyle:check

      - name: SpotBugs
        run: mvn -B -DskipTests spotbugs:check

      - name: JaCoCo coverage gate
        run: mvn -B -DskipTests jacoco:check

      - name: Package
        run: mvn -B -DskipTests package

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: ignore

  # Hors chemin deploy. Sans NVD_API_KEY le sync NVD (~370k CVE) est rate-limité
  # et finit souvent annulé (>1h) — on skip plutôt que bloquer la CI.
  owasp-dependency-check:
    name: OWASP Dependency-Check
    if: github.event_name != 'pull_request' && secrets.NVD_API_KEY != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Cache NVD / Dependency-Check DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/dependency-check
          key: odc-${{ runner.os }}-${{ hashFiles('backend/pom.xml') }}
          restore-keys: |
            odc-${{ runner.os }}-

      - name: OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >
          mvn -B -DskipTests org.owasp:dependency-check-maven:check
          -DdataDirectory="$HOME/.cache/dependency-check"

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # Seuil bloquant: critical (les high Angular 19 n'ont pas encore de patch mineur).
      - name: npm audit prod (critical)
        run: npm audit --omit=dev --audit-level=critical

      - name: npm audit prod high (report)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: npm audit all (report)
        continue-on-error: true
        run: npm audit --audit-level=high || true

      - name: Unit tests
        run: npm run test:ci

      - name: Production build
        env:
          # URL de l’API prod (override possible via variable de repo GITHUB)
          API_URL: ${{ vars.API_URL != '' && vars.API_URL || 'https://devicemanager-x5g4.onrender.com' }}
        run: |
          node scripts/inject-api-url.mjs
          npm run build -- --configuration=production

  trivy-backend-image:
    name: Trivy (backend image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build backend image
        run: docker build -t device-manager-backend:ci ./backend

      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: device-manager-backend:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  deploy:
    name: Deploy Render
    needs: [backend, frontend, trivy-backend-image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger API deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "Secret RENDER_DEPLOY_HOOK_API manquant — skip API"
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
          echo "API deploy triggered"

      - name: Trigger frontend deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "Secret RENDER_DEPLOY_HOOK_WEB manquant — skip front"
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
          echo "Frontend deploy triggered"

  smoke-prod:
    name: Smoke (production health)
    needs: [deploy]
    if: |
      always() && (
        github.event_name == 'workflow_dispatch' ||
        (needs.deploy.result == 'success')
      )
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Curl actuator health
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "vars.API_URL missing — skip smoke-prod gracefully"
            exit 0
          fi
          curl -fsS --retry 5 --retry-delay 10 --retry-all-errors "${API_URL%/}/actuator/health"
          echo
          echo "Health check OK"
