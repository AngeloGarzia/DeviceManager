name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Tests
        run: mvn -B test

      - name: Package
        run: mvn -B -DskipTests package

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm run test:ci

      - name: Production build
        env:
          # URL de l’API prod (override possible via variable de repo GITHUB)
          API_URL: ${{ vars.API_URL != '' && vars.API_URL || 'https://devicemanager-x5g4.onrender.com' }}
        run: |
          node scripts/inject-api-url.mjs
          npm run build -- --configuration=production

  deploy:
    name: Deploy Render
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger API deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "Secret RENDER_DEPLOY_HOOK_API manquant — skip API"
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
          echo "API deploy triggered"

      - name: Trigger frontend deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "Secret RENDER_DEPLOY_HOOK_WEB manquant — skip front"
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
          echo "Frontend deploy triggered"
