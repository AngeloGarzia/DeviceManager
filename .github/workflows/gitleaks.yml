name: Gitleaks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Faux positifs : ajoutez le fingerprint (ou le chemin) dans .gitleaksignore
# à la racine du dépôt — voir https://github.com/gitleaks/gitleaks#gitleaksignore

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
