# Toutes les valeurs sensibles viennent de :
#   .env.development  (défaut)
#   .env.production   (APP_ENV=production ou spring.profiles.active=production)
# Aucune de ces variables n'est exposée au frontend.

server:
  # Render injecte PORT ; en local on garde SERVER_PORT / 8080
  port: ${PORT:${SERVER_PORT:8080}}
  tomcat:
    # Plan free 512 Mo : éviter 200 threads Tomcat (stacks + native).
    threads:
      max: ${SERVER_TOMCAT_THREADS_MAX:25}
      min-spare: ${SERVER_TOMCAT_THREADS_MIN_SPARE:2}
    accept-count: ${SERVER_TOMCAT_ACCEPT_COUNT:50}
    max-http-form-post-size: 45MB
    max-swallow-size: 45MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    # Évite le fingerprinting (versions Java/OS/env) via /actuator/info
    env:
      enabled: false
    java:
      enabled: false
    os:
      enabled: false
  health:
    # DB visible sur /actuator/health (diag). Render utilise /actuator/health/liveness
    # (render.yaml) → pas de redémarrage plateforme si MySQL est down.
    db:
      enabled: true
    diskspace:
      enabled: false
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

spring:
  application:
    name: device-manager
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      # Free-tier prudence (Aiven/Render) : recycle avant sockets morts.
      # Aiven Free ne documente pas un wait_timeout court (souvent ~8h MySQL) ;
      # 25 min = sous le défaut MySQL ~8h, avec marge réseau/proxy.
      max-lifetime: 1500000
      # Doit être < max-lifetime ; ne s'applique que si minimum-idle < maximum-pool-size.
      idle-timeout: 1200000
      # Défaut Hikari 7 explicité ; doit rester < max-lifetime.
      keepalive-time: 120000
      # Peu de connexions chaudes sur plan gratuit (évite 10 sockets idle).
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:1}
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:3}
      # Timeouts réseau driver MySQL (ms) — évite un thread bloqué sur socket mort.
      data-source-properties:
        connectTimeout: 10000
        socketTimeout: 30000
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        boot.allow_jdbc_metadata_access: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
    # false = laisse démarrer malgré checksum mismatch (repair gère le reste)
    validate-on-migrate: ${SPRING_FLYWAY_VALIDATE_ON_MIGRATE:true}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 45MB
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  ai:
    # Autoconfig Spring AI désactivée : le chat est créé à la demande depuis Setup (clé + modèle).
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
          temperature: ${OPENAI_CHAT_TEMPERATURE:0.3}

app:
  jwt:
    secret: ${APP_JWT_SECRET:}
    access-expiration-ms: ${APP_JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${APP_JWT_REFRESH_EXPIRATION_MS:604800000}
    # Alias rétrocompatible (durée access) — APP_JWT_EXPIRATION_MS ou access
    expiration-ms: ${APP_JWT_EXPIRATION_MS:${APP_JWT_ACCESS_EXPIRATION_MS:900000}}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
    allow-dev-localhost: ${APP_CORS_ALLOW_DEV_LOCALHOST:true}
  security:
    login-rate-limit-per-minute: ${APP_LOGIN_RATE_LIMIT_PER_MINUTE:20}
    login-account-max-failures: ${APP_LOGIN_ACCOUNT_MAX_FAILURES:10}
    login-account-failure-window-minutes: ${APP_LOGIN_ACCOUNT_FAILURE_WINDOW_MINUTES:15}
    login-account-lock-minutes: ${APP_LOGIN_ACCOUNT_LOCK_MINUTES:15}
  mail:
    enabled: ${APP_MAIL_ENABLED:false}
    from: ${APP_MAIL_FROM:noreply@devicemanager.local}
    admin-email: ${APP_MAIL_ADMIN_EMAIL:admin@devicemanager.local}
  frontend-base-url: ${APP_FRONTEND_BASE_URL:}
  s3:
    # Object storage S3-compatible — Cloudflare R2 (bucket privé + URLs présignées)
    enabled: ${APP_S3_ENABLED:false}
    bucket: ${APP_S3_BUCKET:}
    region: ${APP_S3_REGION:auto}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
    # API R2 : https://<ACCOUNT_ID>.r2.cloudflarestorage.com
    endpoint: ${AWS_S3_ENDPOINT:}
    # Optionnel (legacy bucket public) — non requis si URLs présignées
    public-base-url: ${APP_S3_PUBLIC_BASE_URL:}
    # TTL URLs présignées GET (bucket privé)
    presigned-url-expiration-minutes: ${APP_S3_PRESIGNED_URL_EXPIRATION_MINUTES:15}
    presigned-document-expiration-minutes: ${APP_S3_PRESIGNED_DOCUMENT_EXPIRATION_MINUTES:60}
    local-fallback-dir: ${APP_S3_LOCAL_FALLBACK_DIR:uploads}
  ai:
    enabled: ${APP_AI_ENABLED:false}
    default-provider: ${AI_DEFAULT_PROVIDER:openai}
    default-model: ${AI_DEFAULT_MODEL:}
  # Ping HTTP optionnel pour retarder la veille Render free (désactivé par défaut).
  keepalive:
    enabled: ${APP_KEEPALIVE_ENABLED:false}
    url: ${APP_KEEPALIVE_URL:}
    interval-ms: ${APP_KEEPALIVE_INTERVAL_MS:840000}
    initial-delay-ms: ${APP_KEEPALIVE_INITIAL_DELAY_MS:60000}
  # Tick minute des jobs métier (horaire réel = AppSettings SCHED_*_HOUR/MINUTE).
  schedule:
    tick-cron: ${APP_SCHEDULE_TICK_CRON:0 * * * * *}
  logs:
    # Rétention des logs SLF4J persistés en table app_log (consultation admin)
    retention-max: ${ADMIN_LOG_RETENTION_MAX:5000}
    flush-interval-ms: ${ADMIN_LOG_FLUSH_INTERVAL_MS:1000}
    flush-batch-size: ${ADMIN_LOG_FLUSH_BATCH_SIZE:100}

logging:
  level:
    com.devicemanager: ${LOGGING_LEVEL_COM_DEVICEMANAGER:INFO}
