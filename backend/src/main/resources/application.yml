# Toutes les valeurs sensibles viennent de :
#   .env.development  (défaut)
#   .env.production   (APP_ENV=production ou spring.profiles.active=prod)
# Aucune de ces variables n'est exposée au frontend.

server:
  # Render injecte PORT ; en local on garde SERVER_PORT / 8080
  port: ${PORT:${SERVER_PORT:8080}}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # Render free : éviter 503 sur /actuator/health si MySQL est lent/indispo
    # (sinon redémarrages en boucle / page « almost online »)
    db:
      enabled: false
    diskspace:
      enabled: false
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

spring:
  application:
    name: device-manager
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: ${APP_JWT_SECRET:}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  mail:
    enabled: ${APP_MAIL_ENABLED:false}
    from: ${APP_MAIL_FROM:noreply@devicemanager.local}
    admin-email: ${APP_MAIL_ADMIN_EMAIL:admin@devicemanager.local}
  s3:
    enabled: ${APP_S3_ENABLED:false}
    bucket: ${APP_S3_BUCKET:}
    region: ${APP_S3_REGION:eu-west-3}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
    endpoint: ${AWS_S3_ENDPOINT:}
    local-fallback-dir: ${APP_S3_LOCAL_FALLBACK_DIR:uploads}

logging:
  level:
    com.devicemanager: ${LOGGING_LEVEL_COM_DEVICEMANAGER:INFO}
