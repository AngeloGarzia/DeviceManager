# Toutes les valeurs sensibles viennent de :
#   .env.development  (défaut)
#   .env.production   (APP_ENV=production ou spring.profiles.active=production)
# Aucune de ces variables n'est exposée au frontend.

server:
  # Render injecte PORT ; en local on garde SERVER_PORT / 8080
  port: ${PORT:${SERVER_PORT:8080}}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # Render free : éviter 503 sur /actuator/health si MySQL est lent/indispo
    # (sinon redémarrages en boucle / page « almost online »)
    db:
      enabled: false
    diskspace:
      enabled: false
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

spring:
  application:
    name: device-manager
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        boot.allow_jdbc_metadata_access: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  ai:
    # Autoconfig Spring AI désactivée : le chat est créé à la demande depuis Setup (clé + modèle).
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
          temperature: ${OPENAI_CHAT_TEMPERATURE:0.3}

app:
  jwt:
    secret: ${APP_JWT_SECRET:}
    access-expiration-ms: ${APP_JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${APP_JWT_REFRESH_EXPIRATION_MS:604800000}
    # Alias rétrocompatible (durée access) — APP_JWT_EXPIRATION_MS ou access
    expiration-ms: ${APP_JWT_EXPIRATION_MS:${APP_JWT_ACCESS_EXPIRATION_MS:900000}}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
    allow-dev-localhost: ${APP_CORS_ALLOW_DEV_LOCALHOST:true}
  security:
    login-rate-limit-per-minute: ${APP_LOGIN_RATE_LIMIT_PER_MINUTE:20}
  mail:
    enabled: ${APP_MAIL_ENABLED:false}
    from: ${APP_MAIL_FROM:noreply@devicemanager.local}
    admin-email: ${APP_MAIL_ADMIN_EMAIL:admin@devicemanager.local}
  s3:
    enabled: ${APP_S3_ENABLED:false}
    bucket: ${APP_S3_BUCKET:}
    region: ${APP_S3_REGION:eu-west-3}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
    endpoint: ${AWS_S3_ENDPOINT:}
    local-fallback-dir: ${APP_S3_LOCAL_FALLBACK_DIR:uploads}
  ai:
    enabled: ${APP_AI_ENABLED:false}
    default-provider: ${AI_DEFAULT_PROVIDER:openai}
    default-model: ${AI_DEFAULT_MODEL:}
  # Ping HTTP optionnel pour retarder la veille Render free (désactivé par défaut).
  keepalive:
    enabled: ${APP_KEEPALIVE_ENABLED:false}
    url: ${APP_KEEPALIVE_URL:}
    interval-ms: ${APP_KEEPALIVE_INTERVAL_MS:840000}
    initial-delay-ms: ${APP_KEEPALIVE_INITIAL_DELAY_MS:60000}
  logs:
    # Rétention des logs SLF4J persistés en table app_log (consultation admin)
    retention-max: ${ADMIN_LOG_RETENTION_MAX:5000}
    flush-interval-ms: ${ADMIN_LOG_FLUSH_INTERVAL_MS:1000}
    flush-batch-size: ${ADMIN_LOG_FLUSH_BATCH_SIZE:100}

logging:
  level:
    com.devicemanager: ${LOGGING_LEVEL_COM_DEVICEMANAGER:INFO}
