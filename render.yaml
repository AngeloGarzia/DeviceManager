# Blueprint Render — 100% gratuit (sans carte bancaire)
# - API : Web Service free (peut s'endormir après inactivité)
# - Front : Static Site free
# - MySQL : externe gratuit (Aiven Free — pas de CB)
# Docs: https://render.com/docs/blueprint-spec

services:
  # ---------- API Spring Boot (free) ----------
  - type: web
    name: device-manager-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    autoDeployTrigger: commit
    healthCheckPath: /actuator/health/liveness
    envVars:
      - key: APP_ENV
        value: production
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: SERVER_PORT
        value: "8080"
      # À renseigner dans le Dashboard (Aiven Free MySQL)
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # Schéma géré par Flyway — validate uniquement
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: validate
      - key: SPRING_JPA_SHOW_SQL
        value: "false"
      - key: APP_JWT_SECRET
        generateValue: true
      - key: APP_JWT_ACCESS_EXPIRATION_MS
        value: "900000"
      - key: APP_JWT_REFRESH_EXPIRATION_MS
        value: "604800000"
      - key: APP_JWT_EXPIRATION_MS
        value: "900000"
      # Origine exacte du frontend (ex: https://device-manager-web.onrender.com) — pas de wildcard
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
      - key: APP_CORS_ALLOW_DEV_LOCALHOST
        value: "false"
      - key: APP_LOGIN_RATE_LIMIT_PER_MINUTE
        value: "20"
      - key: APP_MAIL_ENABLED
        value: "false"
      - key: APP_MAIL_FROM
        value: noreply@devicemanager.local
      - key: APP_MAIL_ADMIN_EMAIL
        value: admin@devicemanager.local
      - key: MAIL_HOST
        value: ""
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        value: ""
      - key: MAIL_PASSWORD
        value: ""
      - key: APP_S3_ENABLED
        value: "false"
      - key: APP_S3_BUCKET
        value: ""
      - key: APP_S3_REGION
        value: eu-west-3
      - key: AWS_ACCESS_KEY_ID
        value: ""
      - key: AWS_SECRET_ACCESS_KEY
        value: ""
      - key: AWS_S3_ENDPOINT
        value: ""
      # Disque éphémère sur free : les photos peuvent disparaître au redémarrage
      - key: APP_S3_LOCAL_FALLBACK_DIR
        value: /app/uploads
      - key: LOGGING_LEVEL_COM_DEVICEMANAGER
        value: INFO

  # ---------- Frontend Angular (static free) ----------
  - type: web
    name: device-manager-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && node scripts/inject-api-url.mjs && npm run build -- --configuration=production
    staticPublishPath: dist/frontend/browser
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    envVars:
      - key: API_URL
        fromService:
          name: device-manager-api
          type: web
          property: host
