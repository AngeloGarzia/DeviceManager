# Clever Cloud — Static Apache backend.
#
# La présence de ce fichier bascule l'app Static Clever sur un serveur Apache
# qui lit ces directives (en plus de CC_WEBROOT et CC_STATIC_FLAGS).
#
# Objectif : SPA fallback universel pour Angular.
# Toute URL qui ne pointe PAS vers un fichier existant du bundle (JS/CSS/images)
# est servie avec /index.html afin que le routeur Angular puisse reprendre la main.
# Indispensable pour les deep-links (ex. lien reset mdp /reset-password?token=…).
#
# Documentation : https://www.clever-cloud.com/doc/applications/static/
#   « Advanced configuration » → fichier clevercloud/static-apache.conf

# FallbackResource ne redirige QUE les requêtes qui ne correspondent à aucun
# fichier/dossier existant sous DocumentRoot (= CC_WEBROOT). Les assets réels
# (chunk-*.js, styles-*.css, favicon.ico, etc.) sont donc servis normalement.
FallbackResource /index.html

# Par défaut : aucun cache pour les documents HTML / routes SPA.
# Sans cela, un onglet ou un proxy peut resservir un ancien index.html qui
# pointe encore vers un vieux main-*.js (ancien menu Accueil/Pièces/…).
Header set Cache-Control "no-store, no-cache, must-revalidate"

# Cache long uniquement pour les assets fingerprintés par Angular (hash dans le nom).
<FilesMatch "\.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|webp|ico)$">
    Header set Cache-Control "public, max-age=31536000, immutable"
</FilesMatch>
